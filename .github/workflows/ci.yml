name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features

  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Fuzz block deserialize
        run: cargo +nightly fuzz run fuzz_block_deserialize -- -max_total_time=60
        working-directory: .

      - name: Fuzz transaction deserialize
        run: cargo +nightly fuzz run fuzz_transaction_deserialize -- -max_total_time=60
        working-directory: .

      - name: Fuzz message deserialize
        run: cargo +nightly fuzz run fuzz_message_deserialize -- -max_total_time=60
        working-directory: .

      - name: Fuzz witness deserialize
        run: cargo +nightly fuzz run fuzz_witness_deserialize -- -max_total_time=60
        working-directory: .

      - name: Fuzz locking condition
        run: cargo +nightly fuzz run fuzz_locking_condition -- -max_total_time=60
        working-directory: .

      - name: Fuzz varint
        run: cargo +nightly fuzz run fuzz_varint -- -max_total_time=60
        working-directory: .

  roadmap:
    name: Validate Roadmap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate roadmap
        run: ./scripts/roadmap-validate.sh

      - name: Test roadmap scripts
        run: ./scripts/test-roadmap-scripts.sh

      - name: Show roadmap status
        run: ./scripts/roadmap-status.sh
