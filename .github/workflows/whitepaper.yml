name: Build Whitepaper PDF

on:
  push:
    paths:
      - 'whitepaper/**'
      - '.github/workflows/whitepaper.yml'
  pull_request:
    paths:
      - 'whitepaper/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: pqcoin.tex
          working_directory: whitepaper

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: pqcoin-whitepaper
          path: whitepaper/pqcoin.pdf

      - name: Upload PDF to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: whitepaper/pqcoin.pdf
